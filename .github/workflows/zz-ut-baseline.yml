name: zz-ut-baseline

# Baseline probe for ci-unit-tests. Dispatch only. The dependency token is
# minted for the source organisation, as a pull request run there would mint
# it; the reachability step shows what the sandbox-scoped token can read.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ut-baseline:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Token scoped to the sandbox (the action's default here)
        id: sbx
        continue-on-error: true
        uses: actions/create-github-app-token@07e2b760664f080c40eec4eacf7477256582db36 # v3.1.1
        with:
          client-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          permission-contents: read

      - name: Token scoped to the source organisation
        id: src
        continue-on-error: true
        uses: actions/create-github-app-token@07e2b760664f080c40eec4eacf7477256582db36 # v3.1.1
        with:
          client-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: BHoM
          permission-contents: read

      - name: Dependency reachability
        shell: bash
        env:
          SBX: ${{ steps.sbx.outputs.token }}
          SRC: ${{ steps.src.outputs.token }}
          DEPS: "BHoM/BHoM BHoM/BHoM_Adapter BHoM/BHoM_Engine BHoM/TriangleNet_Toolkit BHoM/Test_Toolkit"
        run: |
          for d in $DEPS; do
            a=fail; b=fail
            [ -n "$SBX" ] && git ls-remote --heads "https://x-access-token:${SBX}@github.com/${d}.git" HEAD >/dev/null 2>&1 && a=ok
            [ -n "$SRC" ] && git ls-remote --heads "https://x-access-token:${SRC}@github.com/${d}.git" HEAD >/dev/null 2>&1 && b=ok
            echo "reach ${d} sandbox-token=${a} source-token=${b}"
          done

      - name: Run unit tests
        uses: BHoM/CI_Toolkit/.github/actions/ci-unit-tests@develop
        with:
          fallback_token: ${{ steps.src.outputs.token || steps.sbx.outputs.token }}
