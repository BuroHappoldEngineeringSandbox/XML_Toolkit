name: zz-ut-probe

on:
  workflow_dispatch:

jobs:
  unit-tests-probe:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Run unit tests
        uses: BHoM/CI_Toolkit/.github/actions/ci-unit-tests@develop
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
